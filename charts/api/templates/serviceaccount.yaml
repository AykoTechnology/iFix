{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ifix-api.serviceAccountName" . }}
  labels:
    {{- include "ifix-api.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
# `automountServiceAccountToken: false` — o api não fala com a API do Kubernetes.
# Um token de conta de serviço montado sem uso é só superfície de roubo de credencial
# a mais, e é exatamente o tipo de coisa que PodSecurityStandards Restricted não
# proíbe sozinho (não é campo do padrão) mas que a Regra de Ouro 1 cobre em espírito.
automountServiceAccountToken: false
{{- end -}}
