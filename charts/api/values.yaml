# Valores do chart do api. O securityContext do Pod e do contêiner NÃO é exposto
# aqui de propósito: PodSecurityStandards Restricted e a Regra de Ouro 1 (imutabilidade
# Distroless) não são uma preferência de ambiente, são invariante do produto — se
# fossem parâmetro, um `values-prod.yaml` poderia desligá-las em silêncio.

image:
  repository: ifix-api
  # Vazio usa .Chart.AppVersion — mesma convenção do chart do worker.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 3000

probes:
  # Os três caminhos precisam bater com as rotas de `src/api/src/server.ts`. Mudar um
  # lado sem o outro só apareceria depois do deploy, como pod que nunca fica Ready —
  # por isso `tests/deploy-invariants.test.ts` compara os dois e reprova a divergência.
  liveness:
    path: /health/live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    path: /health/startup
    # ~150s de orçamento (30 tentativas × 5s) para a migração terminar de rodar antes
    # de a liveness ter chance de reprovar o pod que ainda está inicializando.
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    # Sem limite de CPU de propósito: um limite de CPU produz *throttling* sob rajada
    # mesmo com capacidade ociosa no nó, e é exatamente sob rajada que a latência
    # menos pode piorar. O HPA por CPU abaixo é o mecanismo de conter o uso agregado.
    memory: 256Mi

# Orçamento de encerramento (Regra de Ouro 8). `terminationGracePeriodSeconds: 30` é
# fixo no template, e o relógio dele começa ANTES do preStop — a documentação do
# Kubernetes é explícita: "the Pod's termination grace period countdown begins before
# the PreStop hook is executed". Logo o processo não tem 30s depois do SIGTERM, tem
# 30 − preStopSleepSeconds. A conta precisa fechar com folga:
#
#   preStopSleepSeconds (5s) + shutdownTimeoutMs (20s) + margem (≥ 2s) ≤ 30s
#
# `scripts/check-helm-security.mjs` reprova o chart se a soma não fechar. O valor é
# injetado como SHUTDOWN_TIMEOUT_MS no contêiner — o padrão de 25s do código
# (`src/api/src/config.ts`) vale para rodar fora do cluster e, aqui, estouraria o prazo.
preStopSleepSeconds: 5
shutdownTimeoutMs: 20000

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Segredos e configuração vêm de fora do chart (Épico 12.6 — origem única de
# segredos): o chart só referencia nomes, nunca gera Secret nem ConfigMap com valor.
envFrom:
  - secretRef:
      name: ifix-api-env
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
