name: CI

# Esteira dos gates da § 6.4 da especificação.
#
# Estão ativos os gates que têm artefato para verificar. Os demais NÃO aparecem aqui
# como etapa que sempre passa: um gate que nunca reprova é indistinguível de gate
# nenhum, e já custou um defeito real neste repositório — ver a entrada de 2026-09-22
# em docs/PLAYBOOKS/INCIDENTS_LEARNING.md sobre o contrato OpenAPI vazio.
#
#   ativos    1 (lint/format) · 2 (typecheck) · 3 e 4 (testes + cobertura)
#             5 (RLS, por teste estrutural) · 6 (drift de OpenAPI)
#             8 (dependências e segredos) · 9 (imagem + Trivy, api e workers)
#             7 (Axe por história do Storybook) · 10 (design tokens) · 12 (ADRs)
#             11 (Helm — helm lint, kubeconform, admissão PSS restricted num
#                kube-apiserver real, Regra de Ouro 8)
#   pendentes charts/infra fica de fora do gate 11: ainda é só README, à espera dos
#             riscos R9 (modelo de entrega) e R6 (destino de observabilidade) da
#             especificação. O job confere que continua vazio — não é passo que
#             sempre passa, reprova assim que alguém adicionar templates sem
#             atualizar esta esteira.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  qualidade:
    name: Gates 1, 2, 6, 7, 10 e 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Gate 1 — lint
        run: npm run lint

      - name: Gate 1 — formatação
        run: npm run format

      - name: Gate 2 — verificação de tipos
        run: npm run typecheck

      - name: Gate 12 — sincronia dos ADRs com a especificação
        run: npm run adr:check

      - name: Gate 6 — drift do contrato OpenAPI
        run: npm run openapi:check

      - name: Gate 10 — drift dos artefatos de design
        run: npm run tokens:check

      - name: Gate 10 — valor estético fora de tokens.json
        run: npm run design:literals

      # O gate 7 propriamente dito roda com os testes (Axe sobre cada história). Este
      # passo garante que a vitrine ainda COMPILA: uma história quebrada deixaria de
      # ser testada em silêncio, e o gate passaria por ter menos o que verificar.
      - name: Gate 7 — a vitrine do Storybook compila
        run: npm run storybook:build

  testes:
    name: Gates 3, 4 e 5
    runs-on: ubuntu-latest

    services:
      # ADR-018 exige banco real: as políticas RLS só existem no motor do banco, e um
      # mock provaria apenas que concorda consigo mesmo. O mesmo vale para a fila —
      # timeout de visibilidade e reentrega são semântica do pgmq, não do cliente.
      #
      # Imagem oficial do projeto pgmq, fixada na mesma versão que o
      # `scripts/local-db/install-pgmq.sh` instala localmente. O contêiner de serviço
      # não tem sistema de arquivos acessível ao job, então instalar a extensão nele
      # depois não é possível: ela precisa já vir na imagem.
      postgres:
        image: ghcr.io/pgmq/pg16-pgmq:v1.13.0
        env:
          POSTGRES_PASSWORD: local_dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: ifix_test
      PGPASSWORD: local_dev_only
      PGSUPERPASSWORD: local_dev_only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Provisionar banco efêmero e aplicar migrações
        run: ./scripts/local-db/reset.sh

      - name: Gates 3, 4 e 5 — testes e cobertura
        # A suíte inclui os testes estruturais que reprovam qualquer tabela sem RLS
        # forçada, sem gatilho de auditoria ou com política de escrita sem WITH CHECK.
        run: npx vitest run --coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  seguranca:
    name: Gate 8 — dependências e segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o varredor de segredos precisa do histórico

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vulnerabilidades em dependências
        run: npm audit --audit-level=high

      # A action oficial do gitleaks exige licença paga quando o repositório pertence
      # a uma organização; o binário é MIT e sem restrição. Usar o binário mantém o
      # gate executando de verdade em vez de ficar desligado por questão de licença.
      - name: Segredos versionados
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          # Varre o histórico completo (daí o fetch-depth: 0 acima): um segredo
          # removido em commit posterior continua recuperável e continua vazado.
          gitleaks git --no-banner --redact --exit-code 1 .

  container:
    name: Gate 9 — imagem Distroless e Trivy (${{ matrix.imagem }})
    runs-on: ubuntu-latest
    strategy:
      # Uma entrada por alvo do Dockerfile (ver comentário no topo do arquivo): o
      # build multi-estágio existe justamente para os dois compartilharem `build` e
      # `deps` sem duplicar a lógica de empacotamento, e a matriz aqui evita duplicar
      # os passos de verificação do mesmo jeito.
      matrix:
        include:
          - alvo: runtime-api
            imagem: ifix-api
          - alvo: runtime-workers
            imagem: ifix-workers
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.alvo }}
          push: false
          load: true
          tags: ${{ matrix.imagem }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.alvo }}
          cache-to: type=gha,mode=max,scope=${{ matrix.alvo }}

      # Antes do Trivy, de propósito. Esta asserção verifica uma invariante NOSSA
      # (ADR-001 exige nonroot); o Trivy verifica a higiene da base, que é de terceiro.
      # Com a ordem invertida, uma CVE na base aborta o job e esconde se o nosso
      # próprio requisito foi cumprido — foi o que aconteceu na primeira execução real.
      - name: Conferir que a imagem roda sem privilégio
        run: |
          usuario=$(docker inspect --format '{{.Config.User}}' ${{ matrix.imagem }}:${{ github.sha }})
          echo "usuário da imagem: ${usuario}"
          [ "${usuario}" = "nonroot:nonroot" ] || { echo "esperado nonroot:nonroot"; exit 1; }

      - name: Trivy — bloqueia CVSS ≥ 7.0
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.imagem }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  helm:
    name: Gate 11 — charts Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Os binários do gate são conferidos contra o SHA-256 publicado na release, fixado
      # aqui — não contra um `.sha256sum` baixado da mesma origem, que só pegaria
      # corrupção, nunca um artefato trocado. Atualizar a versão exige atualizar o hash.
      - name: Instalar helm
        env:
          HELM_VERSION: 3.22.0
          HELM_SHA256: 1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb
        run: |
          curl -sSLf -o helm.tar.gz "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check --strict
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm.tar.gz

      - name: Instalar kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSLf -o kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform kubeconform.tar.gz

      - name: helm lint
        run: npm run helm:lint

      # `kubeconform` prova que o YAML renderizado é um manifesto Kubernetes válido —
      # inclusive o `ScaledObject`/`TriggerAuthentication` do KEDA, cujo schema não
      # vem embutido no `kubeconform` e por isso é buscado no catálogo da datree —
      # fixado num commit, não no branch `main`: um schema alterado a montante mudaria
      # o que este gate aceita sem nenhuma mudança neste repositório.
      - name: Schema Kubernetes/KEDA
        env:
          CRDS_CATALOG_SHA: ad3b08c5045129d7bb1eeffd8e61719b2c8dd1e2
        run: |
          set -euo pipefail
          for chart in charts/api charts/workers; do
            echo "== $chart =="
            helm template "$chart" --kube-version 1.30.0 | kubeconform \
              -kubernetes-version 1.30.0 -summary -strict \
              -schema-location default \
              -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRDS_CATALOG_SHA}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          done

      # A parte que `helm lint`/`kubeconform` não cobrem: que o Deployment
      # renderizado É PodSecurityStandards Restricted e desliga de forma coordenada
      # (ADR-001, Regra de Ouro 8) — ver scripts/check-helm-security.mjs.
      - name: PodSecurityStandards Restricted + Regra de Ouro 8
        run: npm run helm:security

      # A lista acima é mantida à mão. Este passo pergunta ao próprio Kubernetes: sobe
      # um kube-apiserver 1.30 (sem nós, sem Docker — a admissão da PSS roda dentro do
      # apiserver) e aplica os workloads com --dry-run=server num namespace
      # `restricted`. Ver scripts/check-helm-psa.mjs, inclusive o controle negativo.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Admissão real da PSS (kube-apiserver 1.30)
        env:
          SETUP_ENVTEST_VERSION: v0.25.1
          ENVTEST_K8S_VERSION: 1.30.3
        run: |
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
          KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use "${ENVTEST_K8S_VERSION}" -p path)"
          export KUBEBUILDER_ASSETS
          npm run helm:psa

      # charts/infra ainda não tem conteúdo (ver cabeçalho do arquivo). Este passo
      # não é decorativo: falha assim que alguém adicionar `templates/` sem também
      # estender este job para validá-lo, em vez de deixar a lacuna passar em
      # silêncio.
      - name: charts/infra continua só README (R9/R6 em aberto)
        run: |
          if [ -d charts/infra/templates ]; then
            echo "charts/infra ganhou templates — estenda este job para validá-los" >&2
            exit 1
          fi
