{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ifix-workers.serviceAccountName" . }}
  labels:
    {{- include "ifix-workers.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# O worker consome pgmq e fala com o Postgres — nenhuma chamada à API do
# Kubernetes. Um token montado seria superfície de ataque sem uso, igual ao
# do chart do api.
automountServiceAccountToken: false
{{- end }}
